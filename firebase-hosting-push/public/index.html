</style></head><body><main class="card">

<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-messaging-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyDKe8SyAjMfDY9UavENY5ywcVyK_JZetWE",
  authDomain: "last-demons.firebaseapp.com",
  projectId: "last-demons",
  storageBucket: "last-demons.firebasestorage.app",
  messagingSenderId: "36761061003",
  appId: "1:36761061003:web:dec18c5ee7757beb1e768e"
});
const messaging=firebase.messaging();
const FALLBACK="https://last-demons-esports-zs3kcunxuyc4lxix4olw8.streamlit.app/";
const hash=new URLSearchParams(location.hash.slice(1));
const assertion=hash.get("a")||"";
let returnUrl=hash.get("r")||FALLBACK;
// Security: only allow HTTPS return destinations. Streamlit public URL is the fallback.
try {
  const u=new URL(returnUrl);
  if(u.protocol!=="https:") throw new Error("bad protocol");
} catch(_) { returnUrl=FALLBACK; }
document.getElementById("back").href=returnUrl;
const status=document.getElementById("status");
document.getElementById("enable").onclick=async()=>{
  try {
    if(!assertion) throw new Error("Link di attivazione scaduto o non valido.");
    const permission=await Notification.requestPermission();
    if(permission!=="granted") throw new Error("Permesso notifiche non concesso.");
    const registration=await navigator.serviceWorker.register("/firebase-messaging-sw.js",{scope:"/"});
    const token=await messaging.getToken({vapidKey:"BP57184jsi7pZ6CatNnkwLqxLDYpAkSilBVnIFl7GwGKl0-QAZYiGVQ_2N5-vD4hCJaFlhuHd6Tcbo0v7b0aCJs",serviceWorkerRegistration:registration});
    if(!token) throw new Error("Token notifiche non disponibile.");
    const r=await fetch("https://eroqddxxlfjdopxyftml.supabase.co/functions/v1/register-push",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({assertion:assertion,fcm_token:token,user_agent:navigator.userAgent})});

    history.replaceState(null,"",location.pathname);
    status.textContent="✅ Notifiche attivate. Ritorno all'app…";
    setTimeout(()=>location.replace(returnUrl),1200);
  } catch(e) {
    status.textContent="⚠️ "+(e?.message||"Errore durante l'attivazione.");
  }
};
