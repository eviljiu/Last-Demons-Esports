name: LD - Pulizia prove

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Eliminare le immagini scadute'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ld-proof-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install 'psycopg2-binary>=2.9,<3' 'requests>=2.31,<3'

      - name: Pulizia o verifica
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            python scripts/cleanup_proofs.py --apply
          else
            python scripts/cleanup_proofs.py
          fi
